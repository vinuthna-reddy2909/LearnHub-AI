services:
  - type: web
    name: learnhub-ai-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false   # Set manually in Render dashboard (MongoDB Atlas URI)
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: GEMINI_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false   # Set to your Vercel URL, e.g. https://learnhub-ai.vercel.app
