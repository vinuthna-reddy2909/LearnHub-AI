databases:
  - name: learnhub-ai-postgres
    databaseName: learnhubai
    user: learnhubai
    plan: free

services:
  - type: web
    name: learnhub-ai-backend
    runtime: docker
    region: oregon
    plan: free
    rootDir: backend-java
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: learnhub-ai-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: learnhub-ai-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: learnhub-ai-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: learnhub-ai-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: learnhub-ai-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
